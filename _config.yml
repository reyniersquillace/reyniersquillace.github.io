# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Reynier Squillace
email: squillace@virginia.edu
description: >- # this means to ignore newlines until "baseurl:"
  PhD candidate studying algorithms for radio astronomy and weird binaries in the nearby universe. Also, science reporter and circus geek.
github_username: reyniersquillace
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Reynier Squillace"
  avatar : "/assets/images/106_2556.JPG"
  bio    : "I'm Reynier Squillace, a third-year PhD candidate at the University of Virginia. I write code for the CHIME All-sky Multiday Pulsar Stack Search, a project based in Penticton, Canada that stacks observations of the sky together every day to search for new transients. I'm interested in algorithm development for messy radio data, and applying those algorithms to weird binaries in space. I also write for ExplorersWeb as a science and history reporter. In my spare time, I teach trapeze and take photos on hikes."
  links:
    - label: "Email"
      icon: "fa fa-envelope-square"
      url: "squillace@virginia.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/reyniersquillace"
    - label: "ExplorersWeb"
      icon: "fa fa-wpexplorer"
      url: "explorersweb.com/author/reynier/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/reyniersquillace"
      
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
